name: Validate Cases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate cases.jsonl
        run: |
          python -c "
          import json
          with open('cases.jsonl') as f:
              for i, line in enumerate(f, 1):
                  line = line.strip()
                  if not line: continue
                  try:
                      json.loads(line)
                  except Exception as e:
                      print(f'Line {i} JSON error: {e}'); raise SystemExit(1)
              print(f'All {i} lines valid JSONL')
          "
      - name: Check for required fields per case
        run: |
          python -c "
          import json
          required_top = ['case_id', 'category', 'title', 'scenario', 'query_form', 'expert_recommendation', 'regulatory_anchor']
          missing = []
          with open('cases.jsonl') as f:
              for line in f:
                  if not line.strip(): continue
                  obj = json.loads(line)
                  for field in required_top:
                      if field not in obj: missing.append((obj.get('case_id','?'), field))
          if missing:
              for m in missing: print(f'Missing field {m[1]} in case {m[0]}')
              raise SystemExit(1)
          print('All cases have required fields')
          "
